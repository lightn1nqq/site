<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var savedScheme = localStorage.getItem('color-scheme');
        if (savedScheme === 'light' || savedScheme === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = savedScheme;
          document.documentElement.dataset.theme = savedScheme;
        }
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f3f7" media="(prefers-color-scheme: light)" />
    <title>lightn1ng — Проекты и контакты</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
